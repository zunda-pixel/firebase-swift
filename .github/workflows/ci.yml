name: CI

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    container: swift:latest
    steps:
    - uses: actions/checkout@v7.0.1
    - run: swift test --only-use-versions-from-resolved-file --enable-swift-testing --parallel --filter OfflineTests
  integration:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    container: swift:latest
    steps:
    - uses: actions/checkout@v7.0.1
    - run: swift test --only-use-versions-from-resolved-file --enable-swift-testing --parallel --skip OfflineTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOOGLE_USER_ID: ${{ secrets.GOOGLE_USER_ID }}
        FIREBASE_API_TOKEN: ${{ secrets.FIREBASE_API_TOKEN }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_PROJECT_NAME: ${{ secrets.FIREBASE_PROJECT_NAME }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  lint:
    runs-on: ubuntu-24.04-arm
    container: swift:latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift format lint -r -p -s .
